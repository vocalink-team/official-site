<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="version" content="2.24.24">
<title>VOCALINK-TEAM | パスワード再設定</title>
<style>
:root{--bg:#10100f;--panel:#171715;--line:#37352f;--text:#eeeae2;--muted:#aaa49a;--accent:#b9a78f;--ok:#899b91;--danger:#d88787}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--ok);font-weight:800}
h1{font-size:42px;letter-spacing:-.06em;margin:12px 0 22px}p{color:var(--muted);line-height:1.7;font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin-top:16px}
input{width:100%;padding:13px;background:#0d1115;color:var(--text);border:1px solid var(--line);border-radius:10px;margin-top:7px}
button{width:100%;border:1px solid var(--line);background:#e4ddd2;color:#151411;padding:12px 14px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}.error{color:var(--danger)}.success{color:#a9d8bd}
a{color:#b9d5ea;font-size:12px}
.hidden{display:none!important}

/* VL-0001 accessibility hardening | v2.24.12 */
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:3px solid #e5a76c;outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
<h1>RESET.</h1>
<section id="requestView">
<p>管理画面のログインに使用しているメールアドレスを入力してください。パスワード再設定用のメールを送信します。</p>
<label for="email">メールアドレス</label>
<input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
<button id="sendBtn">再設定メールを送信</button>
<div id="requestMsg" class="msg"></div>
</section>
<section id="updateView" class="hidden">
<p>新しいパスワードを設定してください。8文字以上のパスワードを設定してください。</p>
<label for="newPassword">新しいパスワード</label>
<input id="newPassword" type="password" autocomplete="new-password">
<label for="confirmPassword">新しいパスワード（確認）</label>
<input id="confirmPassword" type="password" autocomplete="new-password">
<button id="updateBtn">パスワードを更新</button>
<div id="updateMsg" class="msg"></div>
</section>
<p><a href="./admin.html">← 管理画面へ戻る</a></p>
</main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe');
const $=s=>document.querySelector(s);
const setMsg=(el,text,kind='')=>{el.textContent=text;el.className='msg '+kind};
const redirectUrl=new URL('./reset-password.html',window.location.href).href;
const landingHash=new URLSearchParams(window.location.hash.slice(1));
const recoveryLanding=landingHash.get('type')==='recovery'&&!!landingHash.get('access_token');
const landingAccessToken=landingHash.get('access_token');
const linkError=landingHash.get('error_description')||landingHash.get('error');
if(linkError)setMsg($('#requestMsg'),'再設定リンクが無効、使用済み、または期限切れです。新しいメールを送信してください。','error');


let recoveryConfirmed=false;
let recoveryOpening=false;
let recoveryEventSeen=false;
async function showRecoveryView(){
  if((!recoveryEventSeen&&!recoveryLanding)||recoveryOpening||recoveryConfirmed||linkError)return;
  recoveryOpening=true;
  try{
    const{data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError||!session||(recoveryLanding&&!recoveryEventSeen&&session.access_token!==landingAccessToken)){setMsg($('#requestMsg'),'再設定リンクを確認できませんでした。新しいメールを送信してください。','error');return}
    const{data:{user},error}=await sb.auth.getUser();
    if(error||!user){setMsg($('#requestMsg'),'再設定リンクを確認できませんでした。もう一度メールを送信してください。','error');return}
    recoveryConfirmed=true;
    $('#requestView').classList.add('hidden');
    $('#updateView').classList.remove('hidden');
  }catch(error){
    console.error('recovery verification failed',error);
    setMsg($('#requestMsg'),'再設定リンクを確認できませんでした。もう一度メールを送信してください。','error');
  }finally{recoveryOpening=false}
}
sb.auth.onAuthStateChange(event=>{
  if(event==='PASSWORD_RECOVERY'){
    recoveryEventSeen=true;
    setTimeout(()=>{void showRecoveryView()},0);
  }
});
$('#sendBtn').onclick=async()=>{
  const field=$('#email'),email=field.value.trim();
  if(!email||!field.checkValidity()){setMsg($('#requestMsg'),'有効なメールアドレスを入力してください。','error');return}
  $('#sendBtn').disabled=true;
  setMsg($('#requestMsg'),'再設定メールを送信しています…');
  try{
    const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl});
    if(error){console.error('password reset request failed',error);setMsg($('#requestMsg'),'再設定メールを送信できませんでした。時間をおいて再度お試しください。','error')}
    else setMsg($('#requestMsg'),'登録されたアカウントの場合、再設定メールが届きます。メール内のリンクをご確認ください。','success');
  }catch(error){
    console.error('password reset request failed',error);
    setMsg($('#requestMsg'),'通信に失敗しました。時間をおいて再度お試しください。','error');
  }finally{$('#sendBtn').disabled=false}
};
$('#updateBtn').onclick=async()=>{
  if(!recoveryConfirmed){setMsg($('#updateMsg'),'再設定リンクからアクセスしてください。','error');return}
  const p=$('#newPassword').value,c=$('#confirmPassword').value;
  if(p.length<8){setMsg($('#updateMsg'),'パスワードは8文字以上にしてください。','error');return}
  if(p!==c){setMsg($('#updateMsg'),'2つのパスワードが一致していません。','error');return}
  $('#updateBtn').disabled=true;
  setMsg($('#updateMsg'),'パスワードを更新しています…');
  try{
    const{error}=await sb.auth.updateUser({password:p});
    if(error){console.error('password update failed',error);setMsg($('#updateMsg'),'更新できませんでした。リンクの期限を確認して再度お試しください。','error');return}
    recoveryConfirmed=false;
    setMsg($('#updateMsg'),'パスワードを更新しました。管理画面へ移動します。','success');
    await sb.auth.signOut();
    setTimeout(()=>location.href='./admin.html',1200);
  }catch(error){
    console.error('password update failed',error);
    setMsg($('#updateMsg'),'通信に失敗しました。時間をおいて再度お試しください。','error');
  }finally{$('#updateBtn').disabled=false}
};
// Recovery links may initialize a session before PASSWORD_RECOVERY is observed.
// The initial recovery token must match the active session for this fallback.
if(recoveryLanding)setTimeout(()=>{void showRecoveryView()},0);
// Ordinary signed-in sessions cannot open the recovery form.
</script>
</body>
</html>
