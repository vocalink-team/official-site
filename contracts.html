<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalink-team | 契約管理</title><style>
:root{--bg:#0d1013;--panel:#151a1f;--line:#293139;--text:#edf1f3;--muted:#9aa6af;--accent:#dce5ea;--danger:#ff9ca3;--ok:#8ed9b0;--warn:#f2ce78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--line);background:#0d1013ee;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}header .wrap{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span{color:#8f9da8}.user{font-size:12px;color:var(--muted)}main{padding:30px 0 70px}.hidden{display:none!important}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:10vh auto}h1{font-size:clamp(34px,6vw,62px);letter-spacing:-.06em;margin:8px 0 24px}h2{margin:0 0 14px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#8f9da8;font-weight:800}.msg{color:var(--muted)}input,select,textarea{width:100%;padding:12px;background:#0e1216;color:var(--text);border:1px solid var(--line);border-radius:10px;margin:6px 0 12px}textarea{min-height:100px;resize:vertical}label{font-size:12px;color:var(--muted)}button{border:1px solid var(--line);background:#1a2026;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#11161a}.danger{color:#ffd0d4}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.stat strong{display:block;font-size:28px;margin-top:6px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{color:#8f9da8;font-size:10px;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800}.active{background:#193026;color:var(--ok)}.warn{background:#332c1b;color:var(--warn)}.danger-b{background:#351f23;color:var(--danger)}.neutral{background:#242a30;color:#c7d0d6}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.close{float:right}.event{border-left:2px solid #59636c;padding:10px 14px;margin:10px 0;background:#11161a;border-radius:0 10px 10px 0}.search{max-width:400px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid,.cards,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.cards,.formgrid{grid-template-columns:1fr}.wrap{width:calc(100% - 18px)}}
</style></head><body><header><div class="wrap"><div class="brand">VOCALINK<span>-TEAM / CONTRACTS</span></div><div id="who" class="user"></div></div></header><main class="wrap">
<section id="login" class="panel login"><div class="eyebrow">SECURE CONTRACT MANAGEMENT</div><h1>CONTRACTS.</h1><p class="msg">契約管理権限のあるアカウントでログインしてください。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary">ログイン</button><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden"><div class="toolbar"><div><div class="eyebrow">CONTRACT MANAGEMENT</div><h1>契約管理</h1><p class="msg">契約・更新期限・関連案件・履歴を一元管理します。</p></div><div class="actions"><button id="newBtn" class="primary">＋ 新規契約</button><button id="logout">ログアウト</button></div></div>
<div class="grid"><div class="panel stat"><div class="eyebrow">TOTAL</div><strong id="total">—</strong><small class="msg">契約総数</small></div><div class="panel stat"><div class="eyebrow">ACTIVE</div><strong id="activeCount">—</strong><small class="msg">締結・有効</small></div><div class="panel stat"><div class="eyebrow">RENEWAL</div><strong id="renewalCount">—</strong><small class="msg">更新期限が近い契約</small></div><div class="panel stat"><div class="eyebrow">EXPIRED</div><strong id="expiredCount">—</strong><small class="msg">期限超過</small></div></div>
<div class="panel"><div class="toolbar"><div><div class="eyebrow">CONTRACT REGISTER</div><h2>契約一覧</h2></div><div class="actions"><input id="search" class="search" placeholder="契約番号・名称・相手先を検索"><select id="statusFilter"><option value="">全ステータス</option><option value="draft">下書き</option><option value="reviewing">確認中</option><option value="pending_signature">締結前</option><option value="active">締結済み・有効</option><option value="renewal_pending">更新待ち</option><option value="terminated">解約</option><option value="expired">期限切れ</option><option value="cancelled">キャンセル</option></select></div></div><div id="status" class="msg"></div></div>
<div class="panel table-wrap"><table><thead><tr><th>契約番号</th><th>契約名</th><th>種別</th><th>相手先</th><th>担当</th><th>期間</th><th>金額</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div id="modal" class="modal"><div class="modal-card"><button class="close" id="close">閉じる</button><div class="eyebrow">CONTRACT RECORD</div><h2 id="modalTitle">新規契約</h2><div class="formgrid"><div><label>契約番号 *</label><input id="fNumber"></div><div><label>契約名 *</label><input id="fTitle"></div><div><label>契約種別</label><select id="fType"><option value="business_outsourcing">業務委託契約</option><option value="management">マネジメント契約</option><option value="member">メンバー契約</option><option value="debugger">デバッガー契約</option><option value="client">取引先契約</option><option value="nda">秘密保持契約</option><option value="other">その他</option></select></div><div><label>ステータス</label><select id="fStatus"><option value="draft">下書き</option><option value="reviewing">確認中</option><option value="pending_signature">締結前</option><option value="active">締結済み・有効</option><option value="renewal_pending">更新待ち</option><option value="terminated">解約</option><option value="expired">期限切れ</option><option value="cancelled">キャンセル</option></select></div><div><label>相手先</label><input id="fCounterparty"></div><div><label>相手先メール</label><input id="fEmail" type="email"></div><div><label>担当者</label><input id="fResponsible"></div><div><label>契約金額</label><input id="fAmount" type="number" min="0" step="0.01"></div><div><label>開始日</label><input id="fStart" type="date"></div><div><label>終了日</label><input id="fEnd" type="date"></div><div><label>更新通知日数</label><input id="fNotice" type="number" min="0" value="30"></div><div><label>支払頻度</label><input id="fFrequency" placeholder="一括 / 月額 / 年額など"></div><div><label>契約書URL</label><input id="fDoc" type="url" placeholder="Supabase Storage等のURL"></div><div><label>自動更新</label><select id="fRenew"><option value="false">なし</option><option value="true">あり</option></select></div></div><label>備考</label><textarea id="fNotes"></textarea><div class="actions"><button id="saveBtn" class="primary">保存</button><button id="deleteBtn" class="danger">削除</button></div><p id="formMsg" class="msg"></p><hr style="border-color:var(--line);border-width:1px 0 0;margin:22px 0"><div class="eyebrow">HISTORY</div><div id="events"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://qvxoxrzvxyyribqjnpkb.supabase.co',SUPABASE_KEY='sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let contracts=[],editing=null;
const typeNames={business_outsourcing:'業務委託',management:'マネジメント',member:'メンバー',debugger:'デバッガー',client:'取引先',nda:'NDA',other:'その他'},statusNames={draft:'下書き',reviewing:'確認中',pending_signature:'締結前',active:'締結済み',renewal_pending:'更新待ち',terminated:'解約',expired:'期限切れ',cancelled:'キャンセル'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function badge(s){let c=['active'].includes(s)?'active':['renewal_pending','pending_signature','reviewing'].includes(s)?'warn':['expired','terminated','cancelled'].includes(s)?'danger-b':'neutral';return '<span class="badge '+c+'">'+esc(statusNames[s]||s)+'</span>'}
async function hasPerm(action){const {data,error}=await sb.rpc('has_team_permission',{p_permission:'contracts',p_action:action});return !error&&data===true}
async function auth(){const {data,error}=await sb.auth.getSession();if(error||!data.session)return false;const ok=await hasPerm('view');if(!ok){await sb.auth.signOut();$('loginMsg').textContent='契約管理を閲覧する権限がありません。';return false}$('who').textContent=data.session.user.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');return true}
async function login(){const b=$('loginBtn');b.disabled=true;b.textContent='ログイン中…';$('loginMsg').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='ログインに失敗しました: '+error.message;b.disabled=false;b.textContent='ログイン';return}const ok=await auth();if(!ok){b.disabled=false;b.textContent='ログイン';}else load()}
async function load(){const {data,error}=await sb.from('contracts').select('*').order('end_date',{ascending:true,nullsFirst:false});if(error){$('status').textContent='読み込み失敗: '+error.message;return}contracts=data||[];render();}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('statusFilter').value;const now=new Date(),soon=new Date(now.getTime()+30*86400000);$('total').textContent=contracts.length;$('activeCount').textContent=contracts.filter(x=>x.status==='active').length;$('renewalCount').textContent=contracts.filter(x=>x.end_date&&new Date(x.end_date)<=soon&&new Date(x.end_date)>=now&&['active','renewal_pending'].includes(x.status)).length;$('expiredCount').textContent=contracts.filter(x=>x.end_date&&new Date(x.end_date)<now&&!['terminated','cancelled','expired'].includes(x.status)).length;const list=contracts.filter(x=>(!f||x.status===f)&&(!q||[x.contract_number,x.title,x.counterparty_name,x.responsible_name].some(v=>String(v||'').toLowerCase().includes(q))));$('rows').innerHTML=list.length?list.map(x=>'<tr><td>'+esc(x.contract_number)+'</td><td>'+esc(x.title)+'</td><td>'+esc(typeNames[x.contract_type]||x.contract_type)+'</td><td>'+esc(x.counterparty_name||'—')+'<br><small>'+esc(x.counterparty_email||'')+'</small></td><td>'+esc(x.responsible_name||'—')+'</td><td>'+esc(x.start_date||'—')+' ～ '+esc(x.end_date||'—')+'</td><td>¥'+Number(x.amount||0).toLocaleString('ja-JP')+(x.payment_frequency?' / '+esc(x.payment_frequency):'')+'</td><td>'+badge(x.status)+'</td><td><button onclick="openContract(\''+x.id+'\')">詳細</button></td></tr>').join(''):'<tr><td colspan="9" class="empty">契約がありません。</td></tr>'}
function openModal(){ $('modal').classList.add('open') }function closeModal(){ $('modal').classList.remove('open');editing=null }
async function openContract(id){editing=contracts.find(x=>x.id===id)||null;$('modalTitle').textContent=editing?'契約詳細・編集':'新規契約';const x=editing||{};for(const [id,key] of Object.entries({fNumber:'contract_number',fTitle:'title',fType:'contract_type',fStatus:'status',fCounterparty:'counterparty_name',fEmail:'counterparty_email',fResponsible:'responsible_name',fAmount:'amount',fStart:'start_date',fEnd:'end_date',fNotice:'renewal_notice_days',fFrequency:'payment_frequency',fDoc:'document_url',fNotes:'notes'}))$(id).value=x[key]??'';$('fRenew').value=String(x.auto_renew??false);$('deleteBtn').style.display=editing?'inline-block':'none';$('formMsg').textContent='';$('events').innerHTML='';openModal();if(editing)loadEvents(editing.id)}
async function save(){if(!(await hasPerm('create'))&&!editing){$('formMsg').textContent='作成権限がありません。';return}if(editing&&!(await hasPerm('update'))){$('formMsg').textContent='編集権限がありません。';return}const payload={contract_number:$('fNumber').value.trim(),title:$('fTitle').value.trim(),contract_type:$('fType').value,status:$('fStatus').value,counterparty_name:$('fCounterparty').value.trim(),counterparty_email:$('fEmail').value.trim(),responsible_name:$('fResponsible').value.trim(),amount:Number($('fAmount').value||0),start_date:$('fStart').value||null,end_date:$('fEnd').value||null,renewal_notice_days:Number($('fNotice').value||30),payment_frequency:$('fFrequency').value.trim()||null,document_url:$('fDoc').value.trim()||null,auto_renew:$('fRenew').value==='true',notes:$('fNotes').value.trim()||null};if(!payload.contract_number||!payload.title){$('formMsg').textContent='契約番号と契約名は必須です。';return}let r=editing?await sb.from('contracts').update(payload).eq('id',editing.id):await sb.from('contracts').insert({...payload,created_by:(await sb.auth.getUser()).data.user?.id});if(r.error){$('formMsg').textContent='保存失敗: '+r.error.message;return}$('formMsg').textContent='保存しました。';await load();setTimeout(closeModal,500)}
async function removeContract(){if(!editing)return;if(!(await hasPerm('delete'))){$('formMsg').textContent='削除権限がありません。';return}if(!confirm('この契約を削除しますか？'))return;const {error}=await sb.from('contracts').delete().eq('id',editing.id);if(error){$('formMsg').textContent='削除失敗: '+error.message;return}closeModal();load()}
async function loadEvents(id){const {data,error}=await sb.from('contract_events').select('*').eq('contract_id',id).order('created_at',{ascending:false});if(error){$('events').textContent='履歴の読み込みに失敗しました。';return}$('events').innerHTML=(data||[]).length?data.map(e=>'<div class="event"><b>'+esc(e.event_type)+'</b><br><small>'+esc(new Date(e.created_at).toLocaleString('ja-JP'))+'</small><br>'+esc(JSON.stringify(e.details||{}))+'</div>').join(''):'<p class="msg">履歴はありません。</p>'}
$('loginBtn').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('newBtn').onclick=()=>openContract(null);$('close').onclick=closeModal;$('saveBtn').onclick=save;$('deleteBtn').onclick=removeContract;$('search').oninput=render;$('statusFilter').onchange=render;auth().then(ok=>{if(ok)load()});
</script></body></html>
