<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalink-team | アカウント設定</title><style>:root{--bg:#0d0f12;--panel:#15191e;--line:#2a323a;--text:#edf1f4;--muted:#96a1ab;--accent:#dbe5ec;--ok:#72d6a1;--danger:#ff858c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{width:min(620px,calc(100% - 28px));margin:10vh auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:850}h1{font-size:clamp(34px,8vw,56px);letter-spacing:-.06em;margin:8px 0 12px}.msg{color:var(--muted);line-height:1.7}label{font-size:12px;color:var(--muted)}input{width:100%;padding:13px;background:#0f1317;color:var(--text);border:1px solid var(--line);border-radius:11px;margin:6px 0 14px}.btn{border:1px solid var(--line);background:#1a2026;color:var(--text);padding:11px 15px;border-radius:11px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#11161a}.ok{color:var(--ok)}.danger{color:var(--danger)}#app{display:none}</style></head><body><main class="wrap"><section class="panel" id="loading"><div class="eyebrow">VOCALINK-TEAM / INVITATION</div><h1>WELCOME.</h1><p class="msg">招待リンクを確認しています…</p></section><section class="panel" id="app"><div class="eyebrow">ACCOUNT SETUP</div><h1>WELCOME.</h1><p class="msg">Vocalink-teamへの招待を受け付けました。新しいパスワードを設定してください。</p><label>新しいパスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="8文字以上"><label>パスワード（確認）</label><input id="password2" type="password" minlength="8" autocomplete="new-password"><button class="btn primary" id="save">パスワードを設定</button><p id="msg" class="msg"></p></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe');const loading=document.querySelector('#loading'),app=document.querySelector('#app'),msg=document.querySelector('#msg');async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){msg.textContent='招待リンクが無効または期限切れです。招待メールを再送してください。';app.style.display='block';loading.style.display='none';return}app.style.display='block';loading.style.display='none';document.querySelector('#save').onclick=async()=>{const p=document.querySelector('#password').value,p2=document.querySelector('#password2').value;if(p.length<8){msg.textContent='パスワードは8文字以上にしてください。';return}if(p!==p2){msg.textContent='パスワードが一致しません。';return}const{error}=await sb.auth.updateUser({password:p});if(error){msg.textContent='パスワード設定に失敗しました。'+error.message;return}const{data:activated,error:activateError}=await sb.functions.invoke('team-member-invite',{body:{action:'activate'}});if(activateError||activated?.error){msg.textContent='パスワードは設定されましたが、チーム参加の有効化に失敗しました。管理者へ連絡してください。';return}msg.innerHTML='<span class="ok">アカウント設定が完了しました。ログイン画面へ移動します。</span>';setTimeout(()=>location.href='index.html',1200)}}init();</script></body></html>
