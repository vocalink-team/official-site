<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalinkSign | デジタル署名</title><link rel="stylesheet" href="signature.css"></head><body><header><div class="wrap"><div class="brand">VOCALINK<span> / SIGN</span></div><div class="toolbar"><span id="user" class="user"></span><button id="logout" class="btn">ログアウト</button></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">DIGITAL SIGNATURE / BETA</div><h1>Sign.<br>Simply.</h1><p>PDFをアップロードし、署名者へ専用リンクを発行できます。署名者はブラウザ上で手書き署名を行い、署名済みPDFを生成します。</p><div class="notice">MVP版です。署名画像・監査ログ・ハッシュ管理を備えていますが、特定の法的要件への適合を保証するものではありません。</div></section><section class="grid"><div class="panel"><div class="eyebrow">CREATE DOCUMENT</div><h2>署名依頼を作成</h2><label>文書タイトル</label><input id="title" placeholder="業務委託契約書"><label>PDFファイル</label><input id="file" type="file" accept="application/pdf"><label>署名者氏名</label><input id="signerName" placeholder="山田 太郎"><label>署名者メールアドレス</label><input id="signerEmail" type="email" placeholder="signer@example.com"><label>署名依頼の有効期限</label><input id="expiresAt" type="datetime-local"><div class="row"><button id="create" class="btn primary">署名リンクを発行</button><span id="msg" class="msg"></span></div><div id="linkPanel" class="hidden"><label>署名リンク</label><div class="linkbox"><input id="signLink" readonly><button id="copy" class="btn">コピー</button></div></div></div><div class="panel"><div class="toolbar"><div><div class="eyebrow">DOCUMENTS</div><h2>署名文書</h2></div><button id="refresh" class="btn">更新</button></div><div id="docs" class="doc-list"><div class="msg">読み込み中...</div></div></div></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const sb=createClient("https://qvxoxrzvxyyribqjnpkb.supabase.co","sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe"),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href="index.html";return}$("#user").textContent=session.user.email||"";await load();$("#logout").onclick=async()=>{await sb.auth.signOut();location.href="index.html"};$("#refresh").onclick=load;$("#copy").onclick=async()=>{await navigator.clipboard.writeText($("#signLink").value);$("#msg").textContent="リンクをコピーしました。"}}async function load(){const{data,error}=await sb.from("signature_documents").select("id,title,status,created_at,signed_path").order("created_at",{ascending:false});if(error){$("#docs").innerHTML="<div class=msg>取得できませんでした。</div>";return}$("#docs").innerHTML=(data||[]).length?(data||[]).map(d=>'<div class="doc"><strong>'+esc(d.title)+'</strong><span class="status '+(d.status==="signed"?"signed":"")+'">'+esc(d.status)+'</span><br><small>'+new Date(d.created_at).toLocaleString("ja-JP")+"</small>"+(d.status==="signed"&&d.signed_path?'<div class="row"><button class="btn" data-download="'+esc(d.id)+'">署名済みPDFを取得</button></div>':"")+"</div>").join(""):'<div class="msg">まだ文書がありません。</div>';document.querySelectorAll("[data-download]").forEach(b=>b.onclick=()=>download(b.dataset.download));document.querySelectorAll("[data-resend]").forEach(b=>b.onclick=()=>resend(b.dataset.resend));document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>cancelRequest(b.dataset.cancel))}async function resend(id){const{data:s}=await sb.from("signature_signers").select("id").eq("document_id",id).eq("status","pending").maybeSingle();if(!s)return alert("再送できる署名依頼がありません。");const{data:r,error}=await sb.functions.invoke("signature-service",{body:{action:"resend",signer_id:s.id}});if(error||r?.error)return alert(error?.message||r?.error||"再送信に失敗しました。");prompt("新しい署名リンクです。",r.signing_url);await load()}async function cancelRequest(id){const{data:s}=await sb.from("signature_signers").select("id").eq("document_id",id).eq("status","pending").maybeSingle();if(!s)return alert("キャンセルできる署名依頼がありません。");if(!confirm("この署名依頼をキャンセルしますか？"))return;const{data:r,error}=await sb.functions.invoke("signature-service",{body:{action:"cancel",signer_id:s.id}});if(error||r?.error)return alert(error?.message||r?.error||"キャンセルに失敗しました。");await load()}async function download(id){const{data:d}=await sb.from("signature_documents").select("signed_path").eq("id",id).single();if(!d?.signed_path)return alert("ファイルを取得できません。");const{data:u,error}=await sb.storage.from("signature-documents").createSignedUrl(d.signed_path,3600,{download:true});if(error)return alert(error.message);location.href=u.signedUrl}async function hash(file){const h=await crypto.subtle.digest("SHA-256",await file.arrayBuffer());return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("")}$("#create").onclick=async()=>{const file=$("#file").files[0],title=$("#title").value.trim(),name=$("#signerName").value.trim(),email=$("#signerEmail").value.trim(),expiresInput=$("#expiresAt").value,expires_at=expiresInput?new Date(expiresInput).toISOString():new Date(Date.now()+7*86400000).toISOString();if(!file||file.type!=="application/pdf")return $("#msg").textContent="PDFファイルを選択してください。";if(!title||!name||!email)return $("#msg").textContent="タイトル・署名者氏名・メールを入力してください。";$("#create").disabled=true;$("#msg").textContent="アップロードしています...";try{const{data:{session}}=await sb.auth.getSession(),path=session.user.id+"/"+crypto.randomUUID()+"-"+file.name.replace(/[^\w.\-]/g,"_"),up=await sb.storage.from("signature-documents").upload(path,file,{contentType:"application/pdf",upsert:false});if(up.error)throw up.error;const{data:doc,error:de}=await sb.from("signature_documents").insert({owner_id:session.user.id,title,original_path:path,original_hash:await hash(file)}).select("id").single();if(de)throw de;const{data:r,error:re}=await sb.functions.invoke("signature-service",{body:{action:"create",document_id:doc.id,email,name,expires_at}});if(re||r?.error)throw new Error(re?.message||r?.error);$("#signLink").value=r.signing_url;$("#linkPanel").classList.remove("hidden");$("#msg").innerHTML='<span class="ok">署名リンクを発行しました。</span>';await load()}catch(e){$("#msg").textContent="作成に失敗しました: "+(e.message||e)}finally{$("#create").disabled=false}};init();</script></body></html>
