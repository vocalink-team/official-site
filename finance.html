<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalink-team | Finance</title><style>:root{--bg:#0b0d10;--p:#12161b;--l:#252c34;--t:#eef2f5;--m:#91a0ad;--a:#dce5ec;--bad:#ff8f98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Noto Sans JP",sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--l)}header .wrap{height:68px;display:flex;align-items:center;justify-content:space-between}.muted{color:var(--m);font-size:13px}main{padding:40px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:22px;margin-bottom:18px}.login{max-width:460px;margin:8vh auto}h1{margin:8px 0 24px}.ey{font-size:10px;letter-spacing:.18em;color:var(--m);font-weight:800}label{display:block;font-size:12px;color:var(--m);margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:#0d1115;color:var(--t)}button{padding:11px 15px;border:1px solid var(--l);border-radius:10px;background:#171c22;color:var(--t);font-weight:800;cursor:pointer}button.primary{width:100%;margin-top:16px;background:var(--a);color:#101317}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:28px;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left;font-size:12px}.bad{color:var(--bad)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><strong>VOCALINK-TEAM / FINANCE</strong><a class="muted" href="admin.html">← Admin</a></div></header><main class="wrap"><section id="login" class="card login"><div class="ey">SECURE FINANCE CONSOLE</div><h1>LOGIN.</h1><p class="muted">経理・収支システムにログインしてください。</p><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" type="button">ログイン</button><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><div class="ey">FINANCE MANAGEMENT</div><h1>収支管理。</h1><div class="tabs"><button type="button" data-tab="ledger">収支管理</button><button type="button" data-tab="dashboard">経営ダッシュボード</button><button type="button" id="logout">ログアウト</button></div><section id="ledger"><div class="grid"><div class="card stat"><div class="ey">TOTAL INCOME</div><strong id="income">¥0</strong></div><div class="card stat"><div class="ey">TOTAL EXPENSE</div><strong id="expense">¥0</strong></div><div class="card stat"><div class="ey">BALANCE</div><strong id="balance">¥0</strong></div><div class="card stat"><div class="ey">UNPAID</div><strong id="unpaid">¥0</strong></div></div><div class="card"><div class="ey">NEW TRANSACTION</div><h2>取引を登録</h2><label>種類</label><select id="type"><option value="income">収入</option><option value="expense">支出</option></select><label>日付</label><input id="date" type="date"><label>カテゴリ</label><input id="category"><label>件名</label><input id="title"><label>金額</label><input id="amount" type="number" min="0"><label>支払状況</label><select id="status"><option value="paid">支払済み / 入金済み</option><option value="unpaid">未払い / 未入金</option><option value="pending">保留</option></select><label>顧客・取引先</label><input id="customer"><label>メモ</label><textarea id="notes"></textarea><button id="add" type="button">登録する</button> <span id="msg" class="muted"></span></div><div class="card table"><h2>取引一覧</h2><table><thead><tr><th>日付</th><th>種類</th><th>カテゴリ</th><th>件名</th><th>金額</th><th>状況</th><th>顧客</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="dashboard" class="hidden"><div class="card"><h2>経営状況</h2><p id="summary" class="muted"></p></div></section></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe');const $=id=>document.getElementById(id);let data=[],busy=false;const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');function loginScreen(msg=''){ $('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=msg}function appScreen(){ $('login').classList.add('hidden');$('app').classList.remove('hidden')}async function permission(){const r=await sb.rpc('has_team_permission',{p_permission:'finance',p_action:'view'});if(r.error)throw r.error;return r.data===true}async function check(){try{const s=await sb.auth.getSession();if(!s.data.session){loginScreen('ログインしてください。');return false}if(!await permission()){loginScreen('このアカウントには経理・収支システムの閲覧権限がありません。');return false}appScreen();return true}catch(e){console.error(e);loginScreen('認証確認に失敗しました：'+(e.message||e));return false}}async function doLogin(){if(busy)return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginMsg').textContent='メールアドレスとパスワードを入力してください。';return}busy=true;$('loginBtn').disabled=true;$('loginBtn').textContent='認証中…';$('loginMsg').textContent='';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const ok=await check();if(ok)await load()}catch(e){console.error(e);loginScreen('ログインに失敗しました：'+(e.message||e))}finally{busy=false;$('loginBtn').disabled=false;$('loginBtn').textContent='ログイン'}}async function load(){const r=await sb.from('finance_transactions').select('*').order('transaction_date',{ascending:false}).order('created_at',{ascending:false});if(r.error){$('msg').textContent=r.error.message;return}data=r.data||[];render()}function render(){const inc=data.filter(x=>x.transaction_type==='income').reduce((a,x)=>a+Number(x.amount||0),0),exp=data.filter(x=>x.transaction_type==='expense').reduce((a,x)=>a+Number(x.amount||0),0),un=data.filter(x=>x.transaction_type==='income'&&x.payment_status!=='paid').reduce((a,x)=>a+Number(x.amount||0),0);$('income').textContent=yen(inc);$('expense').textContent=yen(exp);$('balance').textContent=yen(inc-exp);$('unpaid').textContent=yen(un);$('rows').innerHTML=data.length?data.map(x=>`<tr><td>${x.transaction_date||''}</td><td>${x.transaction_type==='income'?'収入':'支出'}</td><td>${x.category||''}</td><td>${x.title||''}</td><td>${yen(x.amount)}</td><td>${x.payment_status||''}</td><td>${x.customer_name||'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">取引データがありません。</td></tr>';$('summary').textContent=`収入 ${yen(inc)} / 支出 ${yen(exp)} / 利益 ${yen(inc-exp)} / 未入金 ${yen(un)}`}async function add(){const amount=Number($('amount').value);if(!amount||!$('category').value.trim()||!$('title').value.trim()){$('msg').textContent='カテゴリ・件名・金額を入力してください。';return}const r=await sb.from('finance_transactions').insert({transaction_type:$('type').value,transaction_date:$('date').value||new Date().toISOString().slice(0,10),category:$('category').value.trim(),title:$('title').value.trim(),amount,payment_status:$('status').value,customer_name:$('customer').value.trim()||null,notes:$('notes').value.trim()||null});$('msg').textContent=r.error?r.error.message:'登録しました。';if(!r.error)await load()}$('loginBtn').onclick=doLogin;$('password').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('logout').onclick=async()=>{await sb.auth.signOut();loginScreen('ログアウトしました。')};$('add').onclick=add;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ledger,#dashboard').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});check();</script></body></html>
