name: OWASP ZAP Scan
on: [push] # コードがプッシュされたら自動実行

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the webapplication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local static site for the scanner
        run: |
          node tools/build-public.cjs
          python3 tools/serve-static.py --directory _site --bind 0.0.0.0 > /tmp/official-site-http.log 2>&1 &
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://localhost:3000/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Static server did not start')
          PYREADY

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
