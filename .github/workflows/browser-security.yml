name: Browser security regression
on:
  push:
    branches: [main, 'security/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.cjs
      - run: node tools/build-public.cjs
      - run: npx --no-install playwright install --with-deps chromium
      - name: Test isolated site in desktop and mobile viewports
        run: |
          python3 -m http.server 3000 --directory _site --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          node tests/browser-security.js
