<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocalink-team | Customer Management</title><style>
:root{--bg:#0d1013;--panel:#151a1f;--panel2:#10151a;--line:#29323a;--text:#eef2f4;--muted:#93a0aa;--accent:#dbe5ec;--ok:#72d4a0;--warn:#f0c968;--danger:#ff8e96}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b252d 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{width:min(1400px,calc(100% - 32px));margin:auto}header{position:sticky;top:0;z-index:5;background:#0d1013ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}header .wrap{height:70px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#91a0ad}.user{font-size:12px;color:var(--muted)}main{padding:30px 0 70px}.hidden{display:none!important}.login{max-width:460px;margin:10vh auto}.panel{background:linear-gradient(145deg,#181e24,#13181d);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 18px 50px #0003}h1{font-size:clamp(36px,6vw,68px);letter-spacing:-.06em;margin:8px 0 25px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#9aabb7;font-weight:850}.msg{color:var(--muted);line-height:1.6}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#1a2026;color:var(--text);padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#11161a}.btn.danger{color:#ffd1d4}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:30px;margin-top:7px}.search{min-width:260px;max-width:430px}input,select,textarea{width:100%;padding:12px;background:#0e1317;color:var(--text);border:1px solid var(--line);border-radius:11px;margin:6px 0 12px}textarea{min-height:100px;resize:vertical}label{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{color:#9aabb7;font-size:10px;white-space:nowrap}.table-wrap{overflow:auto}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:850}.ok{background:#193328;color:var(--ok)}.warn{background:#332e1c;color:var(--warn)}.danger-b{background:#382126;color:var(--danger)}.muted-b{background:#20262c;color:#bac3c9}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(900px,100%);max-height:90vh;overflow:auto;background:#151a1f;border:1px solid var(--line);border-radius:20px;padding:22px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.record-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.record{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:800px){.stats,.record-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{width:calc(100% - 18px)}.stats,.two,.record-grid{grid-template-columns:1fr}.search{min-width:0;width:100%}}
</style></head><body><header><div class="wrap"><div class="brand">VOCALINK<span>-TEAM / CUSTOMERS</span></div><div id="who" class="user"></div></div></header><main class="wrap"><section id="login" class="panel login"><div class="eyebrow">SECURE CUSTOMER CONSOLE</div><h1>CUSTOMERS.</h1><p class="msg">管理者アカウントでログインしてください。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button class="btn primary" id="loginBtn" type="button">ログイン</button><div id="loginMsg" class="msg"></div></section><section id="app" class="hidden"><div class="toolbar"><div><div class="eyebrow">CUSTOMER MANAGEMENT / v2.0.0</div><h1>CUSTOMERS.</h1><p class="msg">顧客情報・接点・営業案件・請求書・制作案件を顧客単位でまとめて管理します。</p></div><div class="actions"><button class="btn primary" id="newCustomer" type="button">顧客を追加</button><button class="btn" id="refresh" type="button">更新</button><button class="btn danger" id="logout" type="button">ログアウト</button></div></div><div class="stats"><div class="panel stat"><div class="eyebrow">CUSTOMERS</div><strong id="sTotal">—</strong><small class="msg">総顧客数</small></div><div class="panel stat"><div class="eyebrow">ACTIVE</div><strong id="sActive">—</strong><small class="msg">取引中・見込み</small></div><div class="panel stat"><div class="eyebrow">FOLLOW UP</div><strong id="sFollow">—</strong><small class="msg">次回連絡あり</small></div><div class="panel stat"><div class="eyebrow">OVERDUE</div><strong id="sOverdue">—</strong><small class="msg">連絡期限超過</small></div></div><section class="panel"><div class="toolbar"><div><div class="eyebrow">CUSTOMER DIRECTORY</div><h2>顧客一覧</h2></div><div class="actions"><input id="search" class="search" placeholder="会社名・担当者・メール・電話・顧客コードを検索"><select id="statusFilter"><option value="">状態：すべて</option><option value="prospect">見込み</option><option value="active">取引中</option><option value="inactive">休眠</option><option value="closed">取引終了</option></select><select id="rankFilter"><option value="">ランク：すべて</option><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div></div></section><section class="panel table-wrap"><table><thead><tr><th>顧客コード</th><th>会社名</th><th>担当者</th><th>連絡先</th><th>業種</th><th>流入元</th><th>ランク</th><th>状態</th><th>次回連絡</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><div id="modal" class="modal"><div class="modal-card"><div class="toolbar"><h2 id="modalTitle">—</h2><button class="btn" id="close" type="button">閉じる</button></div><div id="modalBody"></div></div></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let customers=[],sessionUser=null;
const statusLabel={prospect:'見込み',active:'取引中',inactive:'休眠',closed:'取引終了'};function admin(u){return['admin','super_admin'].includes(u?.app_metadata?.role)}
async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session||!admin(session.user))return false;sessionUser=session.user;$('#who').textContent=`${session.user.email||''} / ${session.user.app_metadata.role}`;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');return true}
function openModal(t,h){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=h;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
async function load(){const{data,error}=await sb.from('sales_customers').select('*').order('created_at',{ascending:false});if(error){$('#loginMsg').textContent='顧客データの取得に失敗しました。';console.error(error);return}customers=data||[];render()}
function render(){const q=($('#search').value||'').toLowerCase(),sf=$('#statusFilter').value,rf=$('#rankFilter').value;const filtered=customers.filter(x=>{const text=`${x.customer_code||''} ${x.company_name||''} ${x.contact_name||''} ${x.email||''} ${x.phone||''}`.toLowerCase();return(!q||text.includes(q))&&(!sf||x.status===sf)&&(!rf||x.rank===rf)});$('#sTotal').textContent=customers.length;$('#sActive').textContent=customers.filter(x=>['prospect','active'].includes(x.status)).length;$('#sFollow').textContent=customers.filter(x=>x.next_contact_at).length;$('#sOverdue').textContent=customers.filter(x=>x.next_contact_at&&new Date(x.next_contact_at)<new Date()).length;$('#rows').innerHTML=filtered.length?filtered.map(x=>{const overdue=x.next_contact_at&&new Date(x.next_contact_at)<new Date();return `<tr><td>${esc(x.customer_code||'—')}</td><td><b>${esc(x.company_name)}</b></td><td>${esc(x.contact_name||'—')}</td><td>${esc(x.email||'—')}<br>${esc(x.phone||'')}</td><td>${esc(x.industry||'—')}</td><td>${esc(x.source||'—')}</td><td><span class="badge ${x.rank==='A'?'ok':x.rank==='C'?'muted-b':'warn'}">${esc(x.rank||'—')}</span></td><td>${esc(statusLabel[x.status]||x.status||'—')}</td><td>${x.next_contact_at?`<span class="${overdue?'badge danger-b':''}">${new Date(x.next_contact_at).toLocaleString('ja-JP')}</span>`:'—'}</td><td><button class="btn" data-detail="${x.id}" type="button">詳細</button> <button class="btn" data-edit="${x.id}" type="button">編集</button> <button class="btn danger" data-delete="${x.id}" type="button">削除</button></td></tr>`}).join(''):'<tr><td colspan="10" class="empty">条件に一致する顧客がありません。</td></tr>'}
function form(x={}){return `<div class="two"><div><label>顧客コード</label><input id="fCode" value="${esc(x.customer_code||'')}" placeholder="例：CUS-0001"></div><div><label>会社名 *</label><input id="fCompany" value="${esc(x.company_name||'')}" required></div><div><label>担当者</label><input id="fContact" value="${esc(x.contact_name||'')}"></div><div><label>メール</label><input id="fEmail" type="email" value="${esc(x.email||'')}"></div><div><label>電話</label><input id="fPhone" value="${esc(x.phone||'')}"></div><div><label>Webサイト</label><input id="fWebsite" type="url" value="${esc(x.website||'')}"></div><div><label>業種</label><input id="fIndustry" value="${esc(x.industry||'')}"></div><div><label>流入元</label><input id="fSource" value="${esc(x.source||'')}"></div><div><label>ランク</label><select id="fRank"><option ${x.rank==='A'?'selected':''}>A</option><option ${x.rank==='B'||!x.rank?'selected':''}>B</option><option ${x.rank==='C'?'selected':''}>C</option></select></div><div><label>状態</label><select id="fStatus"><option value="prospect" ${x.status==='prospect'?'selected':''}>見込み</option><option value="active" ${x.status==='active'||!x.status?'selected':''}>取引中</option><option value="inactive" ${x.status==='inactive'?'selected':''}>休眠</option><option value="closed" ${x.status==='closed'?'selected':''}>取引終了</option></select></div><div><label>郵便番号</label><input id="fPostal" value="${esc(x.postal_code||'')}"></div><div><label>請求先名義</label><input id="fBilling" value="${esc(x.billing_name||'')}"></div><div><label>支払条件</label><input id="fTerms" value="${esc(x.payment_terms||'')}" placeholder="例：納品後30日"></div><div><label>最終連絡日時</label><input id="fLast" type="datetime-local" value="${x.last_contact_at?new Date(x.last_contact_at).toISOString().slice(0,16):''}"></div><div><label>次回連絡日時</label><input id="fNext" type="datetime-local" value="${x.next_contact_at?new Date(x.next_contact_at).toISOString().slice(0,16):''}"></div></div><label>住所</label><input id="fAddress" value="${esc(x.address||'')}"><label>メモ</label><textarea id="fNotes">${esc(x.notes||'')}</textarea><button class="btn primary" id="saveCustomer" type="button">保存</button><div id="saveMsg" class="msg"></div>`}
function values(){const v=id=>$(id).value.trim();return{customer_code:v('#fCode')||null,company_name:v('#fCompany'),contact_name:v('#fContact')||null,email:v('#fEmail')||null,phone:v('#fPhone')||null,website:v('#fWebsite')||null,industry:v('#fIndustry')||null,source:v('#fSource')||null,rank:v('#fRank'),status:v('#fStatus'),postal_code:v('#fPostal')||null,billing_name:v('#fBilling')||null,payment_terms:v('#fTerms')||null,last_contact_at:$('#fLast').value?new Date($('#fLast').value).toISOString():null,next_contact_at:$('#fNext').value?new Date($('#fNext').value).toISOString():null,address:v('#fAddress')||null,notes:v('#fNotes')||null}}
function edit(x){openModal(x?'顧客情報を編集':'顧客を追加',form(x));$('#saveCustomer').onclick=async()=>{const payload=values();if(!payload.company_name){$('#saveMsg').textContent='会社名を入力してください。';return}const r=x?await sb.from('sales_customers').update(payload).eq('id',x.id):await sb.from('sales_customers').insert(payload);if(r.error){$('#saveMsg').textContent=r.error.message;return}closeModal();await load()}}
async function detail(x){const[deals,inv,projects,acts]=await Promise.all([sb.from('sales_deals').select('title,stage,amount,probability,next_contact_at').eq('customer_id',x.id).order('created_at',{ascending:false}),sb.from('invoices').select('invoice_number,title,amount,status,due_date').eq('customer_id',x.id).order('created_at',{ascending:false}),sb.from('projects').select('name,status,progress,due_date').eq('customer_id',x.id).order('created_at',{ascending:false}),sb.from('sales_activities').select('activity_type,content,activity_at,created_by').eq('customer_id',x.id).order('activity_at',{ascending:false}).limit(20)]);const list=(arr,fn)=>arr?.length?arr.map(fn).join(''):'<p class="msg">ありません。</p>';openModal(x.company_name,`<div class="panel"><b>${esc(x.contact_name||'担当者未設定')}</b><p class="msg">${esc(x.email||'メール未設定')} / ${esc(x.phone||'電話未設定')}</p><p class="msg">${esc(x.address||'住所未設定')}</p><p>${esc(x.notes||'')}</p></div><div class="record-grid"><div class="record"><div class="eyebrow">DEALS</div>${list(deals.data,d=>`<p><b>${esc(d.title)}</b><br>${esc(d.stage)} / ¥${Number(d.amount||0).toLocaleString()}</p>`)}</div><div class="record"><div class="eyebrow">INVOICES</div>${list(inv.data,d=>`<p><b>${esc(d.invoice_number)}</b><br>¥${Number(d.amount||0).toLocaleString()} / ${esc(d.status)}</p>`)}</div><div class="record"><div class="eyebrow">PROJECTS</div>${list(projects.data,d=>`<p><b>${esc(d.name)}</b><br>${esc(d.status)} / ${d.progress||0}%</p>`)}</div></div><div class="panel"><div class="eyebrow">ACTIVITY</div>${list(acts.data,a=>`<p><b>${esc(a.activity_type)}</b> — ${new Date(a.activity_at).toLocaleString('ja-JP')}<br>${esc(a.content)}</p>`)}</div>`)}
$('#loginBtn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginMsg').textContent=error?error.message:'ログイン中...';if(!error){if(await guard())await load();else $('#loginMsg').textContent='管理者権限がありません。'}};$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#close').onclick=closeModal;$('#newCustomer').onclick=()=>edit();$('#refresh').onclick=load;$('#search').oninput=render;$('#statusFilter').onchange=render;$('#rankFilter').onchange=render;document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]'),ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(d){const x=customers.find(c=>c.id===d.dataset.detail);if(x)detail(x)}if(ed){const x=customers.find(c=>c.id===ed.dataset.edit);if(x)edit(x)}if(del){const x=customers.find(c=>c.id===del.dataset.delete);if(x&&confirm(`「${x.company_name}」を削除しますか？\n関連する営業案件・請求書・案件の情報は削除しません。`)){sb.from('sales_customers').delete().eq('id',x.id).then(async r=>{if(r.error)alert(r.error.message);else await load()})}}});(async()=>{if(await guard())await load()})();
</script></body></html>
