pdHKe"),$=s=>document.querySelector(s),token=new URLSearchParams(location.search).get("token");let payload,pad,keyPair=null;async function hashBytes(b){const h=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("")}function resize(){const c=$("#sig"),r=c.getBoundingClientRect(),q=Math.max(devicePixelRatio||1,1);c.width=r.width*q;c.height=180*q;c.getContext("2d").scale(q,q);if(pad)pad.clear()}async function render(url){const pdf=await pdfjsLib.getDocument(url).promise;for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),v=p.getViewport({scale:1.25}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;$("#preview").appendChild(c)}}async function init(){if(!token)return $("#loading").textContent="署名リンクがありません。";const{data,error}=await sb.functions.invoke("signature-service",{body:{action:"get",token}});if(error||data?.error)return $("#loading").textContent=data?.error||error?.message||"署名依頼を取得できません。";payload=data;$("#loading").classList.add("hidden");$("#content").classList.remove("hidden");$("#title").textContent=data.document.title;$("#signer").textContent=data.signer.name;$("#meta").textContent=data.signer.email+" / 状態: "+data.signer.status+(data.signer.expires_at?" / 有効期限: "+new Date(data.signer.expires_at).toLocaleString("ja-JP"):"");if(data.signer.status==="signed")return $("#content").innerHTML='<div class="panel"><h2>署名済みです</h2><p class="msg">この署名依頼はすでに完了しています。</p></div>';const {data:{session}}=await sb.auth.getSession();

await render(data.original_url);pad=new SignaturePad($("#sig"),{minWidth:1,maxWidth:2.4});resize();addEventListener("resize",resize);$("#clear").onclick=()=>pad.clear();$("#sign").onclick=finalize}async function finalize(){if(pad.isEmpty())return $("#msg").textContent="署名を入力してください。";$("#sign").disabled=true;$("#msg").textContent="署名済みPDFを作成しています...";try{const {data:{session}}=await sb.auth.getSession();if(!session||session.user.email.toLowerCase()!==payload.signer.email.toLowerCase()){return $("#msg").textContent="先にメールアドレスの本人確認を完了してください。";}const bytes=new Uint8Array(await(await fetch(payload.original_url)).arrayBuffer()),doc=await PDFDocument.load(bytes);doc.registerFontkit(fontkit);const fontBytes=new Uint8Array(await(await fetch("https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf")).arrayBuffer()),jpFont=await doc.embedFont(fontBytes,{subset:false}),page=doc.getPages()[doc.getPageCount()-1],png=await doc.embedPng(pad.toDataURL("image/png")),w=190,h=w*(png.height/png.width);page.drawImage(png,{x:page.getWidth()-w-35,y:35,width:w,height:h});const helvetica=await doc.embedFont("Helvetica");page.drawText("Signed by",{x:page.getWidth()-w-35,y:22,size:8,font:helvetica,color:rgb(.25,.28,.3)});page.drawText(payload.signer.name,{x:page.getWidth()-w-35+48,y:22,size:8,font:jpFont,color:rgb(.25,.28,.3)});const signedBytes=await doc.save(),signedHash=await hashBytes(signedBytes);

const sigBlob=await(await fetch(pad.toDataURL("image/png"))).blob(),{data:urls,error:e}=await sb.functions.invoke("signature-service",{body:{action:"upload-url",token}});if(e||urls?.error)throw new Error(e?.message||urls?.error);let up=await sb.storage.from("signature-documents").uploadToSignedUrl(urls.pdf.path,urls.pdf.token,new Blob([signedBytes],{type:"application/pdf"}),{contentType:"application/pdf"});if(up.error)throw up.error;up=await sb.storage.from("signature-documents").uploadToSignedUrl(urls.signature.path,urls.signature.token,sigBlob,{contentType:"image/png"});if(up.error)throw up.error;const{data:done,error:de}=await sb.functions.invoke("signature-service",{body:{action:"finalize",token,signed_path:urls.pdf.path,signature_path:urls.signature.path,manifest_path:urls.manifest.path,signed_hash:signedHash,public_key_jwk:publicKey,signature_base64:signatureBase64,signed_content:signedContent}});if(de||done?.error)throw new Error(de?.message||done?.error);$("#msg").innerHTML='<span class="ok">署名が完了しました。</span>';if(done.signed_url){const a=document.createElement("a");a.className="btn primary";a.textContent="署名済みPDFを開く";a.href=done.signed_url;a.target="_blank";$("#msg").append(" ");$("#msg").appendChild(a)}if(done.manifest_url){const m=document.createElement("a");m.className="btn";m.textContent="署名マニフェストJSON";m.href=done.manifest_url;m.target="_blank";$("#msg").append(" ");$("#msg").appendChild(m)}}catch(e){$("#msg").textContent="署名に失敗しました: "+(e.message||e);$("#sign").disabled=false}}init();</script></body></html>
