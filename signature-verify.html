<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocalinkSign | 署名検証</title><link rel="stylesheet" href="signature.css"></head><body><header><div class="wrap"><div class="brand">VOCALINK<span> / SIGN</span></div><div class="user">署名検証</div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">SIGNATURE VERIFICATION</div><h1>Verify.</h1><p>署名済みPDFと署名マニフェストを照合し、PDFハッシュとECDSA署名をブラウザ上で検証します。</p></section><section class="panel"><label>署名済みPDF</label><input id="pdf" type="file" accept="application/pdf"><label>署名マニフェスト JSON</label><input id="manifest" type="file" accept="application/json,.json"><div class="row" style="margin-top:16px"><button id="verify" class="btn primary">検証する</button></div><div id="result" class="msg" style="margin-top:18px"></div></section></main><script>const $=s=>document.querySelector(s);async function sha256(b){const h=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("")}async function verify(){const pdf=$("#pdf").files[0],mf=$("#manifest").files[0];if(!pdf||!mf)return $("#result").textContent="PDFとマニフェストJSONの両方を選択してください。";$("#verify").disabled=true;$("#result").textContent="検証中...";try{const manifest=JSON.parse(await mf.text()),bytes=new Uint8Array(await pdf.arrayBuffer()),hash=await sha256(bytes),hashOk=hash===manifest.signed_pdf_hash;if(!hashOk)throw new Error("署名済みPDFのハッシュが一致しません。PDFが変更されている可能性があります。");const key=await crypto.subtle.importKey("jwk",manifest.public_key_jwk,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]),sig=Uint8Array.from(atob(manifest.signature_base64),c=>c.charCodeAt(0)),sigOk=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,sig,new TextEncoder().encode(manifest.content));if(!sigOk)throw new Error("ECDSA署名の検証に失敗しました。");$("#result").innerHTML='<div class="notice"><span class="ok">✓ 署名検証に成功しました。</span><br><br><strong>署名者：</strong>'+String(manifest.signer_name||"")+"<br><strong>メール：</strong>"+String(manifest.signer_email||"")+"<br><strong>署名日時：</strong>"+(manifest.signed_at?new Date(manifest.signed_at).toLocaleString("ja-JP"):"不明")+"<br><strong>アルゴリズム：</strong>"+String(manifest.algorithm||"")+"<br><strong>PDF SHA-256：</strong><code>"+hash+"</code><br><strong>文書ID：</strong><code>"+String(manifest.document_id||"")+"</code></div>"}catch(e){$("#result").innerHTML='<div class="notice">✕ 検証失敗：'+String(e.message||e).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+"</div>"}finally{$("#verify").disabled=false}}$("#verify").onclick=verify;</script></body></html>
