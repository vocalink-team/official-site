<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEAM RECRUITMENT | vocalink-team</title><style>body{margin:0;background:#11100e;color:#f2eee6;font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(900px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid #39352e}.logo{font-weight:850}.logo span{color:#b7a08a}main{padding:80px 0}.kicker{color:#8fa6a0;font-size:10px;letter-spacing:.2em;font-weight:800}h1{font-size:clamp(50px,9vw,88px);line-height:.9;letter-spacing:-.07em;margin:18px 0}.lead{color:#aaa398;line-height:1.9}.form{margin-top:45px;padding:30px;border:1px solid #39352e;border-radius:20px;background:#ffffff04}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:12px;font-weight:700;margin:20px 0 8px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #39352e;border-radius:11px;background:#151411;color:#f2eee6;font:inherit}textarea{min-height:130px;resize:vertical}.consent{display:flex;gap:10px;align-items:flex-start;color:#aaa398;font-size:12px;line-height:1.7;margin:24px 0}.consent input{width:auto;margin-top:4px}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#e7dfd3;color:#171512;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.msg{display:none;margin-top:15px;padding:13px;border-radius:10px;font-size:13px}.ok{display:block;background:#17332b;color:#bde1d4}.err{display:block;background:#351c1c;color:#f0b7b7}.admin{margin-top:55px;padding-top:30px;border-top:1px solid #39352e}@media(max-width:650px){.grid{grid-template-columns:1fr}.form{padding:22px}}</style><link rel="stylesheet" href="vl-ui.css?v=2.24.0"></head><body class="vl-ui vl-ui"><header><div class="wrap"><a class="logo" href="index.html">vocalink<span>-team</span></a></div></header><main><div class="wrap"><div class="kicker">TEAM MEMBER RECRUITMENT</div><h1>JOIN THE<br>TEAM.</h1><p class="lead">Web・ゲーム・デジタルコンテンツを一緒につくるメンバーを募集しています。経験だけではなく、作りたいという気持ちを大切にします。</p><form id="form" class="form"><div class="grid"><div><label>氏名 *</label><input name="name" required maxlength="100"></div><div><label>メールアドレス *</label><input name="email" type="email" required maxlength="255"></div><div><label>Discord ID</label><input name="discord" maxlength="100"></div><div><label>年齢</label><input name="age" type="number" min="1" max="120"></div></div><label>希望ポジション *</label><select name="role" required><option value="">選択してください</option><option>Web Developer</option><option>Designer / Creator</option><option>Video / Content Creator</option><option>Planner / Project Member</option><option>その他</option></select><label>経験・スキル</label><textarea name="experience" maxlength="3000"></textarea><label>ポートフォリオURL</label><input name="portfolio_url" type="url" maxlength="500" placeholder="https://..."><label>応募理由・やりたいこと *</label><textarea name="motivation" required maxlength="5000"></textarea><label>活動可能時間・曜日</label><textarea name="availability" maxlength="2000"></textarea><label class="consent"><input name="consent" type="checkbox" required><span>応募情報をvocalink-teamの採用活動に利用することに同意します。 *</span></label><button class="btn" id="submit">応募を送信する</button><div id="msg" class="msg"></div></form><div class="admin"><div class="kicker">ADMIN</div><p class="lead">採用担当者はこちらから応募者管理画面へアクセスできます。</p><a href="admin.html">管理者ログイン →</a></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe');const form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.className='msg';msg.textContent='送信中...';msg.style.display='block';const d=Object.fromEntries(new FormData(form));d.age=d.age?Number(d.age):null;d.consent=d.consent==='on';const{error}=await sb.from('team_applications').insert(d);if(error){msg.className='msg err';msg.textContent='送信に失敗しました。時間をおいて再度お試しください。';btn.disabled=false;return}form.reset();msg.className='msg ok';msg.textContent='応募を受け付けました。ご応募ありがとうございます。';btn.disabled=false});</script></body></html>
