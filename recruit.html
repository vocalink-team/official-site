onse.ok||!result.ok){msg.className='msg err';const errors={invalid_application:'入力内容を確認してください。氏名・メールアドレス・希望ポジション・応募理由・同意欄は必須です。',invalid_age:'年齢は1〜120の整数で入力するか、空欄にしてください。',invalid_json:'送信データを読み取れませんでした。ページを再読み込みしてください。',verification_failed:'認証の確認に失敗しました。再度認証してください。',verification_required:'認証が必要です。再度認証してください。',origin_not_allowed:'このページから応募を受け付けできません。公式サイトから開き直してください。',verification_unavailable:'現在応募認証を利用できません。時間をおいて再度お試しください。',rate_limit_exceeded:'送信回数の上限に達しました。しばらくしてからお試しください。'};msg.textContent=errors[result.error]||'送信に失敗しました。時間をおいて再度お試しください。';return}form.reset();window.turnstile?.reset();msg.className='msg ok';msg.textContent='応募を受け付けました。ご応募ありがとうございます。'}catch(error){console.error('Application submission exception',error);msg.className='msg err';msg.textContent='通信エラーが発生しました。接続状況を確認し、時間をおいて再度お試しください。'}finally{btn.disabled=false;window.turnstile?.reset()}});</script></body></html>
