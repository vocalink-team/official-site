<body><div class="wrap"><div class="panel"><div class="eyebrow">vocalink-team / SECURITY</div><h1>TEST EVENT</h1><p class="note">これは実際のDDoSや不正アクセスを発生させず、管理用の擬似イベントを1件登録してDiscord通知経路を確認するテストです。</p><label>管理者メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="login">管理者ログイン</button><button id="test" disabled>🧪 Critical セキュリティ通知をテスト</button><div id="msg" class="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script><script type="module">
const {createClient}=window.supabase;
const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe');
const $=id=>document.getElementById(id); let session;
function admin(u){const r=u?.app_metadata?.role;return r==='admin'||r==='super_admin'}
$('login').onclick=async()=>{ $('msg').textContent='ログイン中...'; const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error){$('msg').className='msg error';$('msg').textContent=error.message;return} if(!admin(data.user)){await sb.auth.signOut();$('msg').className='msg error';$('msg').textContent='管理者権限がありません。';return} session=data.session;$('test').disabled=false;$('msg').className='msg success';$('msg').textContent='管理者としてログインしました。テストボタンを押せます。'};
