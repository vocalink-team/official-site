<main class="wrap"><div class="muted">VOCALINK-TEAM / INFORMATION</div><h1>NEWS.</h1><p class="lead">運営からのお知らせ・最新情報をお届けします。</p>
<form id="searchForm" class="filters" role="search"><div><label for="keyword">キーワード</label><input id="keyword" type="search" maxlength="60" placeholder="タイトル・概要を検索"></div><div><label for="category">カテゴリ</label><select id="category"><option value="">すべて</option></select></div><button type="submit">検索</button></form>
<p id="resultStatus" role="status" aria-live="polite" class="muted">お知らせを読み込んでいます…</p><div id="newsList" class="news-list"></div>
<div class="pagination"><button type="button" id="previous" disabled>前のページ</button><span id="pageLabel" class="muted"></span><button type="button" id="next" disabled>次のページ</button></div>
</main><footer><div class="wrap">© 2026 VOCALINK-TEAM · <a href="index.html">トップページへ</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script><script type="module">
import {sb,articleCard} from './news-public.js?v=2.25.7';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const perPage=12,categories=new Map();let page=Math.max(1,Math.min(10000,Number(params.get('page'))||1)),total=0;
$('keyword').value=(params.get('q')||'').slice(0,60);
async function loadCategories(){
 const {data,error}=await sb.from('news_categories').select('id,name').eq('is_active',true).order('sort_order',{ascending:true});
 if(error)return;
 for(const c of data||[]){categories.set(c.id,c.name);$('category').append(new Option(c.name,c.id))}
 const value=params.get('category')||'';if(categories.has(value))$('category').value=value;
}
function safeQuery(q){return q.replace(/[^\p{L}\p{N}\sー-]/gu,'').trim().slice(0,60)}
async function loadNews(){
 const raw=$('keyword').value.trim(),q=safeQuery(raw),category=$('category').value;
 let query=sb.from('news_articles').select('id,title,slug,excerpt,category_id,is_pinned,published_at',{count:'exact'})
 .eq('status','published').is('deleted_at',null).lte('published_at',new Date().toISOString());
 if(category)query=query.eq('category_id',category);
 if(q)query=query.or('title.ilike.%'+q+'%,excerpt.ilike.%'+q+'%');
 query=query.order('is_pinned',{ascending:false}).order('published_at',{ascending:false}).range((page-1)*perPage,page*perPage-1);
 const {data,error,count}=await query;
 $('newsList').replaceChildren();
 if(error){$('resultStatus').textContent='お知らせを取得できませんでした。時間をおいて再度お試しください。';$('previous').disabled=true;$('next').disabled=true;return}
 total=count||0;const pages=Math.max(1,Math.ceil(total/perPage));
 if(page>pages){page=pages;return loadNews()}
 for(const a of data||[])$('newsList').append(articleCard(a,categories));
 $('resultStatus').textContent=total?total+'件のお知らせが見つかりました。':'現在、該当するお知らせはありません。';
 $('pageLabel').textContent=page+' / '+pages+' ページ';$('previous').disabled=page<=1;$('next').disabled=page>=pages;
 const url=new URL(location.href);url.searchParams.delete('q');url.searchParams.delete('category');url.searchParams.delete('page');
 if(q)url.searchParams.set('q',q);if(category)url.searchParams.set('category',category);if(page>1)url.searchParams.set('page',page);
 history.replaceState(null,'',url);
}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();page=1;void loadNews()});
$('previous').onclick=()=>{if(page>1){page--;void loadNews()}};
$('next').onclick=()=>{if(page*perPage<total){page++;void loadNews()}};
await loadCategories();await loadNews();
</script></body></html>
