<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src https://challenges.cloudflare.com 'sha256-CXERElCOr6YcNQ9zMf6FPYlUT1tySdiMWb+vMzGuOtM='; frame-src https://challenges.cloudflare.com; connect-src https://qvxoxrzvxyyribqjnpkb.supabase.co https://challenges.cloudflare.com">
<title>制作依頼の本番送信確認 | VOCALINK-TEAM</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</head>
<body>
<main>
<h1>制作依頼の本番送信確認</h1>
<p>Turnstileの認証後に、固定のテスト依頼を1件送信します。</p>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFfEXG18WKa3BQcP" data-action="service_request"></div>
<button type="button" id="send">テスト依頼を1件送信</button>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>'use strict';
const message = document.querySelector('#message');
const button = document.querySelector('#send');
if (location.origin !== 'https://www.vocalink-team.com') {
  button.disabled = true;
  message.textContent = 'この確認ページは公式ドメインで使用します。';
}
button.addEventListener('click', async () => {
  if (button.disabled) return;
  const token = window.turnstile?.getResponse();
  if (!token) {
    message.textContent = 'Turnstileの認証が完了したら、送信ボタンを押してください。';
    return;
  }
  button.disabled = true;
  message.textContent = '検証用の依頼を送信しています。';
  try {
    const response = await fetch('https://qvxoxrzvxyyribqjnpkb.supabase.co/functions/v1/submit-service-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'omit',
      body: JSON.stringify({
        name: 'SEC-04 manual verification',
        email: 'sec04-manual-d856fdac4db34703aafd4b78a3a700e6@example.invalid',
        title: 'SEC-04 manual verification d856fdac',
        category: 'その他',
        description: '公式サイトの管理者による検証用データ。確認後に削除します。',
        contact_method: 'email',
        urgent: false,
        consent: true,
        turnstile_token: token
      })
    });
    const result = await response.json();
    message.textContent = response.status === 201 && result.ok === true
      ? 'テスト送信に成功しました。HTTP 201'
      : 'テスト送信の応答はHTTP ' + response.status + 'でした。';
  } catch {
    message.textContent = '応答を確認できませんでした。再送信する前に登録状況を確認してください。';
  }
});</script>
</body>
</html>
