<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>依頼管理 | vocalink-team</title><link rel="stylesheet" href="request.css?v=2.24.24"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>main{width:min(1200px,calc(100% - 32px))}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.toolbar{display:flex;gap:8px}.toolbar button{width:auto;margin:0;padding:11px 16px}.table{overflow:auto;margin-top:25px;border:1px solid #39352e;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:14px;border-bottom:1px solid #39352e;font-size:13px}th{font-size:10px;letter-spacing:.12em;color:#8fa6a0}td a{text-decoration:underline}.pill{border:1px solid #39352e;border-radius:999px;padding:4px 9px;font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.box{width:min(800px,100%);max-height:90vh;overflow:auto;background:#191816;border:1px solid #39352e;border-radius:18px;padding:25px}.box h2{margin-bottom:15px}.detail{white-space:pre-wrap;color:#c9c2b8;background:#11100e;border-radius:10px;padding:13px;margin-bottom:18px}.close{float:right;width:auto!important;margin:0!important;padding:9px 13px!important}</style></head><body><main><div class="eyebrow">vocalink-team / ADMIN</div><h1>依頼管理<span>.</span></h1><section id="login"><p class="intro">管理者アカウントでログインしてください。</p><form id="loginForm"><label>メール<input id="email" type="email" required></label><label>パスワード<input id="password" type="password" required></label><button>ログイン</button><div id="loginMsg"></div></form></section><section id="dash" style="display:none"><div class="top"><div><b>制作依頼一覧</b><div id="who" class="intro" style="margin:4px 0 0"></div></div><div class="toolbar"><button id="reload">更新</button><button id="logout">ログアウト</button></div></div><div class="table"><table><thead><tr><th>受付日時</th><th>依頼者</th><th>カテゴリ</th><th>タイトル</th><th>予算</th><th>納期</th><th>状態</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div class="modal" id="modal"><div class="box"><button class="close" id="close">閉じる</button><h2 id="title"></h2><div id="body"></div></div></div><script src="request-config.js?v=2.24.24"></script><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function admin(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return null;const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}async function load(){const u=await admin();if(!u){$('#login').style.display='block';$('#dash').style.display='none';return}$('#login').style.display='none';$('#dash').style.display='block';$('#who').textContent=u.email||'';const {data,error}=await supabaseClient.from('service_requests').select('*').order('created_at',{ascending:false});if(error){$('#rows').innerHTML='<tr><td colspan="7">読み込みに失敗しました。</td></tr>';return}$('#rows').innerHTML=data.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('ja-JP')}</td><td>${esc(r.name)}<br>${esc(r.email)}</td><td>${esc(r.category)}</td><td><a href="#" data-id="${r.id}">${esc(r.title)}</a></td><td>${esc(r.budget)}</td><td>${esc(r.deadline)}</td><td><span class="pill">${esc(r.status)}</span></td></tr>`).join('');document.querySelectorAll('[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();show(data.find(x=>x.id===a.dataset.id))})}function show(r){$('#title').textContent=r.title;$('#body').innerHTML=`<p><b>依頼者:</b> ${esc(r.name)} / ${esc(r.organization)}</p><p><b>連絡先:</b> ${esc(r.email)} / ${esc(r.phone)}</p><p><b>カテゴリ:</b> ${esc(r.category)}　<b>予算:</b> ${esc(r.budget)}　<b>納期:</b> ${esc(r.deadline)}</p><b>依頼内容</b><div class="detail">${esc(r.description)}</div><b>希望機能</b><div class="detail">${esc(r.features)}</div><b>参考URL</b><div class="detail">${esc(r.reference_urls)}</div><b>その他</b><div class="detail">${esc(r.notes)}</div><label>ステータス<select id="status">${['new','reviewing','quoted','contracted','in_progress','completed','rejected'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>管理者メモ<textarea id="note">${esc(r.admin_note)}</textarea></label><button id="save">保存</button><div id="saveMsg"></div>`;$('#save').onclick=async()=>{const {error}=await supabaseClient.from('service_requests').update({status:$('#status').value,admin_note:$('#note').value}).eq('id',r.id);$('#saveMsg').textContent=error?'保存に失敗しました。':'保存しました。';if(!error)load()};$('#modal').classList.add('open')}$('#loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await supabaseClient.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#loginMsg').textContent='ログインできません。';return}load()};$('#logout').onclick=async()=>{await supabaseClient.auth.signOut();load()};$('#reload').onclick=load;$('#close').onclick=()=>$('#modal').classList.remove('open');load();</script></body></html>
