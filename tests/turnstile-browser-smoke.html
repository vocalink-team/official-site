<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Turnstile test (staging only)</title></head><body><h1>VOCALINK-TEAM Turnstile test</h1><p>運営者向け。テスト送信するとDBにダミー応募が1件作成されます。公開本番にはマージしないでください。</p><div class="cf-turnstile" data-sitekey="0x4AAAAAAFfEXG18WKa3BQcP" data-action="recruit"></div><button id="valid">認証トークン送信</button><button id="invalid">無効トークン送信</button><pre id="result"></pre><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script>const output=document.querySelector('#result');async function test(invalid){const token=invalid?'invalid-test-token':window.turnstile?.getResponse();if(!token){output.textContent='Turnstile認証を完了してください';return}const email='turnstile-test-'+crypto.randomUUID()+'@example.com';output.textContent='送信中';try{const response=await fetch('https://qvxoxrzvxyyribqjnpkb.supabase.co/functions/v1/submit-team-application-secure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'検証用ダミー応募',email,role:'その他',motivation:'接続テスト（削除対象）',consent:true,turnstile_token:token})});const data=await response.json();output.textContent=JSON.stringify({status:response.status,result:data,test_email:email},null,2)}catch(e){output.textContent='通信失敗: '+e.message}finally{window.turnstile?.reset()}}document.querySelector('#valid').onclick=()=>test(false);document.querySelector('#invalid').onclick=()=>test(true)</script></body></html>
