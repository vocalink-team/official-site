<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Turnstile E2E test — staging only</title>
<style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;line-height:1.6}button{margin:.5rem .5rem .5rem 0;padding:.6rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:1rem}input{width:100%;max-width:440px;padding:.5rem}</style></head>
<body>
<h1>VOCALINK-TEAM Turnstile E2E 検証</h1>
<p><strong>運営者専用・本番公開禁止。</strong> 許可済みホスト <code>vocalink-team.github.io</code> 上でのみ正常認証を検証できます。正常送信はダミー応募をDBへ登録し、Discord通知が設定されていれば通知も発生します。終了後に応募IDを照合してテストデータを削除してください。</p>
<label>検証用メールアドレス（連続送信中は固定）<input id="email" type="email" value="turnstile-e2e@example.invalid"></label>
<p>レート制限は同じメールアドレスで1時間に3件までです。各正常送信には新しいTurnstile認証が必要です。</p>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFfEXG18WKa3BQcP" data-action="recruit"></div>
<button id="valid">新しい認証で正常送信</button>
<button id="replay">直前のトークンを再送（403を期待）</button>
<button id="invalid">不正トークンを送信（403を期待）</button>
<pre id="result" aria-live="polite"></pre>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
const output=document.querySelector('#result'), emailInput=document.querySelector('#email');
const endpoint='https://qvxoxrzvxyyribqjnpkb.supabase.co/functions/v1/submit-team-application-secure';
let lastToken='', busy=false, results=[];
async function submit(mode){
 if(busy)return;
 const token=mode==='invalid'?'invalid-test-token':mode==='replay'?lastToken:window.turnstile?.getResponse();
 if(!token){output.textContent='有効なTurnstile認証、または再送する直前のトークンがありません。';return}
 if(!emailInput.checkValidity()||!emailInput.value){output.textContent='メールアドレスを入力してください。';return}
 if(mode==='valid'&&!confirm('ダミー応募をDBへ登録します。実行しますか？'))return;
 busy=true;
 const payload={name:'E2E検証用ダミー応募',email:emailInput.value.trim(),role:'その他',motivation:'E2E検証（テスト終了後に削除）',consent:true,turnstile_token:token};
 try{
  const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await response.json();
  if(mode==='valid')lastToken=token;
  const record={mode,status:response.status,response:data,test_email:payload.email,at:new Date().toISOString()};
  results.push(record);output.textContent=JSON.stringify(results,null,2);
 }catch(e){output.textContent='通信失敗: '+String(e)}
 finally{busy=false;if(mode==='valid')window.turnstile?.reset()}
}
document.querySelector('#valid').onclick=()=>submit('valid');
document.querySelector('#replay').onclick=()=>submit('replay');
document.querySelector('#invalid').onclick=()=>submit('invalid');
</script></body></html>
